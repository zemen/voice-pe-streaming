name: Wyoming LiveKit + SpeechBrain
version: "0.12.1"
slug: wyoming_livekit_speechbrain
description: Streaming wake word (livekit-wakeword) + offline speaker verification (SpeechBrain ECAPA-TDNN) over Wyoming.
url: https://github.com/zemen/voice-pe-streaming
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
ports:
  10400/tcp: 10400
  10401/tcp: 10401
ports_description:
  10400/tcp: Wyoming protocol port
  10401/tcp: Web UI port (debug/enrollment)
ingress: true
ingress_port: 10401
panel_icon: mdi:account-voice
panel_title: Wake Word
map:
  - share:rw
  - config:ro
options:
  sensitivity: 0.5
  save_sample_threshold: 0.25
  predict_interval_seconds: 0.5
  enable_speaker_verification: false
  speaker_threshold: 0.25
  enable_mid_sentence_detection: true
  max_samples: 1000
  max_samples_per_source:
    - "auto-rejected-speaker:1000"
    - "auto-below-threshold:1000"
  debug_logging: false
schema:
  sensitivity: float(0.0,1.0)
  save_sample_threshold: float(0.0,1.0)?
  predict_interval_seconds: float(0.0,10.0)
  enable_speaker_verification: bool
  speaker_threshold: float(0.0,1.0)
  enable_mid_sentence_detection: bool
  max_samples: int(0,1000000)
  max_samples_per_source:
    - "match(^[A-Za-z0-9_-]+:[0-9]+$)"
  debug_logging: bool
