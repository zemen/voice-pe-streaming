[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-livekit-speechbrain"
version = "0.2.0"
description = "Wyoming protocol server for livekit-wakeword + SpeechBrain speaker verification"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "wyoming>=1.0.0",
    "livekit-wakeword>=0.2.0",
    "speechbrain>=1.0.0",
    "torch>=2.0",
    "numpy>=1.24",
    "onnxruntime>=1.17.0",
]

[tool.setuptools]
packages = ["wyoming_livekit_speechbrain"]
