# Recipe for the bundled sputnik.onnx: stock livekit-wakeword prod.yaml parameters plus the
# phrase, phonetic confusables and medium conv-attention. Paths are relative to the CWD.
model_name: sputnik
target_phrases: ["sputnik"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

# Phonetic neighbours of "sputnik" + bare fragments
custom_negative_phrases:
  - "sputum"
  - "spot nick"
  - "put nick"
  - "spud nick"
  - "spoot"
  - "putin"
  - "pootnik"
  - "sputter"
  - "spotting"
  - "spoken"
  - "sputnik's coming"
  - "nick"
  - "spoon"
  - "speak now"
  - "stop it"
  - "spit it"
  - "beatnik"
  - "picnic"
  - "technique"
  - "putting"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1
batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
